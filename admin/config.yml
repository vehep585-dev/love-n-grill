backend:
  name: git-gateway
  branch: master

media_folder: images/uploads
public_folder: /images/uploads

collections:

  - name: settings
    label: "⚙️ Site Settings"
    files:
      - name: site
        label: "General Settings"
        file: content/settings.json
        format: json
        fields:
          - { label: "Restaurant Name",   name: restaurant_name, widget: string }
          - { label: "Phone Number",      name: phone,           widget: string }
          - { label: "WhatsApp (digits only e.g. 923001234567)", name: whatsapp, widget: string }
          - { label: "Email Address",     name: email,           widget: string }
          - { label: "Address",           name: address,         widget: string }
          - { label: "Opening Hours",     name: hours,           widget: string }
          - { label: "Google Maps URL",   name: maps_url,        widget: string }
          - { label: "Instagram URL",     name: instagram,       widget: string }
          - { label: "Facebook URL",      name: facebook,        widget: string }
          - { label: "TikTok URL",        name: tiktok,          widget: string }
          - { label: "Offer Banner Text", name: offer_banner,    widget: string }
          - { label: "Show Offer Banner", name: show_banner,     widget: boolean }

  - name: homepage
    label: "🏠 Homepage"
    files:
      - name: hero
        label: "Hero Section"
        file: content/hero.json
        format: json
        fields:
          - { label: "Eyebrow Text",         name: eyebrow,     widget: string }
          - { label: "Title Line 1",          name: title_line1, widget: string }
          - { label: "Title Line 2 (italic)", name: title_line2, widget: string }
          - { label: "Subtitle",              name: subtitle,    widget: text   }

      - name: about
        label: "About Section"
        file: content/about.json
        format: json
        fields:
          - { label: "Section Label",  name: label,       widget: string }
          - { label: "Section Title",  name: title,       widget: string }
          - { label: "Paragraph 1",    name: paragraph1,  widget: text   }
          - { label: "Paragraph 2",    name: paragraph2,  widget: text   }
          - { label: "Stat 1 Number",  name: stat1_num,   widget: string }
          - { label: "Stat 1 Label",   name: stat1_label, widget: string }
          - { label: "Stat 2 Number",  name: stat2_num,   widget: string }
          - { label: "Stat 2 Label",   name: stat2_label, widget: string }
          - { label: "Stat 3 Number",  name: stat3_num,   widget: string }
          - { label: "Stat 3 Label",   name: stat3_label, widget: string }

      - name: featured_dishes
        label: "Featured Dishes (4 cards)"
        file: content/featured-dishes.json
        format: json
        fields:
          - label: "Dishes"
            name: dishes
            widget: list
            fields:
              - { label: "Name",        name: name,        widget: string }
              - { label: "Description", name: description, widget: text   }
              - { label: "Tag",         name: tag,         widget: string }
              - { label: "Badge (leave blank to hide)", name: badge, widget: string, required: false }
              - { label: "Emoji",       name: emoji,       widget: string }
              - { label: "Photo",       name: image,       widget: image, required: false }

      - name: reviews
        label: "Customer Reviews"
        file: content/reviews.json
        format: json
        fields:
          - label: "Reviews"
            name: reviews
            widget: list
            fields:
              - { label: "Name",     name: name,     widget: string }
              - { label: "Location", name: location, widget: string }
              - { label: "Review",   name: text,     widget: text   }
              - label: "Stars"
                name: stars
                widget: select
                options: ["5", "4", "3"]
                default: "5"

  - name: menu
    label: "🍽️ Full Menu"
    files:
      - name: pizza
        label: "🍕 Pizza"
        file: content/menu/pizza.json
        format: json
        fields:
          - { label: "Category Name", name: category_name, widget: string }
          - { label: "Description",   name: category_desc, widget: string }
          - { label: "Emoji",         name: emoji,         widget: string }
          - { label: "Display Order", name: order,         widget: number }
          - label: "Items"
            name: items
            widget: list
            fields:
              - { label: "Name",        name: name,        widget: string }
              - { label: "Description", name: description, widget: text   }
              - { label: "Price Label", name: price_label, widget: string }
              - { label: "Badge (leave blank to hide)", name: badge, widget: string, required: false }
              - { label: "Photo",       name: image,       widget: image, required: false }

      - name: grill
        label: "🔥 Grill"
        file: content/menu/grill.json
        format: json
        fields:
          - { label: "Category Name", name: category_name, widget: string }
          - { label: "Description",   name: category_desc, widget: string }
          - { label: "Emoji",         name: emoji,         widget: string }
          - { label: "Display Order", name: order,         widget: number }
          - label: "Items"
            name: items
            widget: list
            fields:
              - { label: "Name",        name: name,        widget: string }
              - { label: "Description", name: description, widget: text   }
              - { label: "Price Label", name: price_label, widget: string }
              - { label: "Badge (leave blank to hide)", name: badge, widget: string, required: false }
              - { label: "Photo",       name: image,       widget: image, required: false }

      - name: sides
        label: "🍟 Sides & Snacks"
        file: content/menu/sides.json
        format: json
        fields:
          - { label: "Category Name", name: category_name, widget: string }
          - { label: "Description",   name: category_desc, widget: string }
          - { label: "Emoji",         name: emoji,         widget: string }
          - { label: "Display Order", name: order,         widget: number }
          - label: "Items"
            name: items
            widget: list
            fields:
              - { label: "Name",        name: name,        widget: string }
              - { label: "Description", name: description, widget: text   }
              - { label: "Price Label", name: price_label, widget: string }
              - { label: "Badge (leave blank to hide)", name: badge, widget: string, required: false }
              - { label: "Photo",       name: image,       widget: image, required: false }

      - name: drinks
        label: "🥤 Beverages"
        file: content/menu/drinks.json
        format: json
        fields:
          - { label: "Category Name", name: category_name, widget: string }
          - { label: "Description",   name: category_desc, widget: string }
          - { label: "Emoji",         name: emoji,         widget: string }
          - { label: "Display Order", name: order,         widget: number }
          - label: "Items"
            name: items
            widget: list
            fields:
              - { label: "Name",        name: name,        widget: string }
              - { label: "Description", name: description, widget: text   }
              - { label: "Price Label", name: price_label, widget: string }
              - { label: "Badge (leave blank to hide)", name: badge, widget: string, required: false }
              - { label: "Photo",       name: image,       widget: image, required: false }

  - name: gallery
    label: "📸 Gallery"
    files:
      - name: gallery
        label: "Gallery Images"
        file: content/gallery.json
        format: json
        fields:
          - label: "Images"
            name: images
            widget: list
            fields:
              - { label: "Image",   name: image, widget: image  }
              - { label: "Caption", name: alt,   widget: string }
